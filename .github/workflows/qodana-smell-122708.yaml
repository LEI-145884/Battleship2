# 122708 - Hugo Barroso
name: Qodana smell gate 122708
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2    # confirmar versão atual na documentação do Qodana
        with:
          args: --config,qodana-122708.yaml      # se der erro de argumentos, experimentar com espaço
          use-annotations: true
          post-pr-comment: true