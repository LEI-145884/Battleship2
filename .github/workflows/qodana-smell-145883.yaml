#145883 - Kseniya Fedartsova
name: Qodana Long Method Gate
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana.yaml
          use-annotations: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}