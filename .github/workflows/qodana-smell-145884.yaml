# 145884 - Lukasz Swiecicki
name: Qodana smell gate 145884 (Large Class)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Use the 145884 Qodana config
        run: cp qodana-145884.yaml qodana.yaml
      - uses: JetBrains/qodana-action@v2026.2.2
        with:
          pr-mode: false
          upload-result: true
          use-annotations: true
          post-pr-comment: true
