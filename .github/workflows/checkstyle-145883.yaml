#145883 - Kseniya Fedartsova
name: Checkstyle Naming Gate
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkstyle
        uses: dbeloved/action-checkstyle@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-145883.xml